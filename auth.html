<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вхід — FastStart Digital</title>
  <meta name="theme-color" content="#04050c" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=37" />
  <script src="/js/i18n-a.js?v=1" defer></script>
  <script src="/js/i18n-b.js?v=1" defer></script>
  <script src="/js/i18n-c.js?v=1" defer></script>
  <script src="/js/i18n-d.js?v=9" defer></script>
  <script src="/js/i18n.js?v=3" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { background: #04050c; color: #e2e8f0; font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body>

  <div class="auth-header">
    <a href="/">
      <img src="/LOGO.png?v=2" alt="FD" width="32" height="32" />
      <span class="font-display" style="font-weight:700;font-size:15px;color:#fff">FastStart<span style="color:#22d3ee"> Digital</span></span>
    </a>
    <div data-lang-host></div>
  </div>

  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px">
    <div class="auth-wrap">

      <img src="/LOGO.png?v=2" alt="FastStart Digital" class="auth-logo" width="56" height="56" />

      <div class="auth-card">
        <div style="text-align:center;margin-bottom:24px">
          <h1 class="font-display" style="font-size:22px;font-weight:700;color:#fff;margin:0" id="auth-title">Увійти</h1>
          <p style="font-size:13px;color:#64748b;margin-top:6px">Керуйте своїми проєктами: статуси, заявки, історія.</p>
        </div>

        <div id="auth-msg" class="auth-msg" style="display:none"></div>

        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-tab="login" role="tab">Вхід</button>
          <button type="button" class="auth-tab" data-tab="register" role="tab">Реєстрація</button>
        </div>

        <!-- LOGIN -->
        <div class="auth-panel" data-panel="login">
          <div id="login-main">
            <button type="button" id="google-login" class="auth-google-btn" style="width:100%">
              <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.4 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.4 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40.2 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
              Увійти з Google
            </button>
            <div id="google-turnstile-login" style="display:none;margin-top:10px"></div>

            <div class="auth-divider"><span></span>або<span></span></div>

            <form id="login-form" novalidate>
              <div class="auth-field">
                <label for="login-email">Ваша пошта</label>
                <input id="login-email" type="email" required autocomplete="email" placeholder="name@email.com" />
              </div>
              <div class="auth-field">
                <label for="login-password">Пароль</label>
                <input id="login-password" type="password" required autocomplete="current-password" placeholder="••••••••" />
              </div>
              <div class="auth-row">
                <span></span>
                <button type="button" id="forgot-btn" class="auth-link">Забули пароль?</button>
              </div>
              <div class="cf-turnstile" data-sitekey="0x4AAAAAAEV1VqOA7KyGT76S" data-theme="dark" data-callback="onTurnstileLogin"></div>
              <button type="submit" class="auth-submit">Увійти</button>
            </form>
          </div>

          <div id="recover-box" style="display:none">
            <div style="text-align:center;margin-bottom:16px">
              <div class="font-display" style="font-weight:600;color:#fff;font-size:15px" id="recover-title">Відновлення пароля</div>
              <p style="font-size:12px;color:#64748b;margin-top:4px" id="recover-sub">Ми надішлемо код на вашу пошту</p>
            </div>
            <div id="recover-email-step">
              <div class="auth-field">
                <input id="recover-email" type="email" required autocomplete="email" placeholder="name@email.com" />
              </div>
              <div class="cf-turnstile" data-sitekey="0x4AAAAAAEV1VqOA7KyGT76S" data-theme="dark" data-callback="onTurnstileRecover"></div>
              <button type="button" id="recover-send" class="auth-submit">Продовжити</button>
            </div>
            <div id="recover-code-step" style="display:none">
              <div class="auth-field">
                <input id="recover-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" style="text-align:center;font-size:18px;letter-spacing:6px" />
              </div>
              <div class="auth-field">
                <input id="recover-password" type="password" required autocomplete="new-password" placeholder="Новий пароль (мін. 8)" />
              </div>
              <div class="auth-field">
                <input id="recover-password2" type="password" required autocomplete="new-password" placeholder="Повторіть новий пароль" />
              </div>
              <button type="button" id="recover-confirm" class="auth-submit">Підтвердити</button>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:12px">
              <button type="button" id="recover-back" class="auth-link">← Назад до входу</button>
              <button type="button" id="recover-resend" class="auth-link">Надіслати ще раз</button>
            </div>
          </div>
        </div>

        <!-- REGISTER -->
        <div class="auth-panel" data-panel="register" style="display:none">
          <button type="button" id="google-register" class="auth-google-btn" style="width:100%">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.4 6.1 29.5 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.4 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40.2 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
            Створити акаунт з Google
          </button>
          <div id="google-turnstile-register" style="display:none;margin-top:10px"></div>

          <div class="auth-divider"><span></span>або<span></span></div>

          <form id="reg-form" novalidate>
            <div class="auth-field">
              <label for="reg-email">Ваша пошта</label>
              <input id="reg-email" type="email" required autocomplete="email" placeholder="name@email.com" />
            </div>
            <div class="auth-field">
              <label for="reg-password">Пароль</label>
              <input id="reg-password" type="password" required autocomplete="new-password" placeholder="Мінімум 8 символів" />
            </div>
            <div class="auth-field">
              <label for="reg-password2">Повторіть пароль</label>
              <input id="reg-password2" type="password" required autocomplete="new-password" placeholder="••••••••" />
            </div>
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEV1VqOA7KyGT76S" data-theme="dark" data-callback="onTurnstileRegister"></div>
            <button type="submit" class="auth-submit">Відправити код</button>
          </form>

          <div id="reg-code-box" style="display:none">
            <div class="auth-field">
              <label for="reg-code">Код із листа</label>
              <input id="reg-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" style="text-align:center;font-size:18px;letter-spacing:6px" />
            </div>
            <button type="button" id="reg-confirm" class="auth-submit">Підтвердити</button>
            <div style="text-align:center;margin-top:12px">
              <button type="button" id="reg-resend" class="auth-link">Надіслати ще раз</button>
            </div>
          </div>
        </div>

        <div class="auth-hint" id="auth-switch-hint">
          <button type="button" class="auth-link" data-switch="register">Новий клієнт? Зареєструйтеся</button>
        </div>

        <div class="auth-footer">Захищено Google OAuth. Паролі зберігаються в зашифрованому вигляді.</div>
      </div>

    </div>
  </main>

  <script>
    (function () {
      "use strict";
      var T = window.FSD_T || function (s) { return s; };

      var turnstileToken = { login: "", register: "", recover: "" };
      window.onTurnstileLogin = function (t) { turnstileToken.login = t; };
      window.onTurnstileRegister = function (t) { turnstileToken.register = t; };
      window.onTurnstileRecover = function (t) { turnstileToken.recover = t; };

      var googleMode = { login: null, register: null };

      function goGoogle(kind) {
        var tok = googleMode[kind];
        if (!tok) return;
        var url = "/api/auth/google?mode=select&token=" + encodeURIComponent(tok);
        var n = qp("next") || "";
        if (n) url += "&next=" + encodeURIComponent(n);
        location.href = url;
      }

      document.getElementById("google-login").addEventListener("click", function () {
        var box = document.getElementById("google-turnstile-login");
        if (googleMode.login) { goGoogle("login"); return; }
        box.style.display = "block";
        if (window.turnstile) {
          window.turnstile.render(box, {
            sitekey: "0x4AAAAAAEV1VqOA7KyGT76S",
            theme: "dark",
            callback: function (t) { googleMode.login = t; goGoogle("login"); },
          });
        }
      });
      document.getElementById("google-register").addEventListener("click", function () {
        var box = document.getElementById("google-turnstile-register");
        if (googleMode.register) { goGoogle("register"); return; }
        box.style.display = "block";
        if (window.turnstile) {
          window.turnstile.render(box, {
            sitekey: "0x4AAAAAAEV1VqOA7KyGT76S",
            theme: "dark",
            callback: function (t) { googleMode.register = t; goGoogle("register"); },
          });
        }
      });

      function qp(name) { return new URLSearchParams(location.search).get(name); }

      var next = qp("next") || "";

      fetch("/api/auth/me", { credentials: "same-origin" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.ok && d.user) location.href = next || "/";
        })
        .catch(function () {});

      var cur = qp("tab") === "register" || qp("register") === "1" ? "register" : "login";
      var tabs = Array.prototype.slice.call(document.querySelectorAll(".auth-tab"));
      var panels = Array.prototype.slice.call(document.querySelectorAll(".auth-panel"));

      function showMsg(html, ok) {
        var m = document.getElementById("auth-msg");
        m.style.display = "block";
        m.className = "auth-msg " + (ok ? "ok" : "err");
        m.textContent = html;
      }
      function hideMsg() { document.getElementById("auth-msg").style.display = "none"; }

      function showTab(name) {
        cur = name;
        tabs.forEach(function (t) {
          t.classList.toggle("active", t.getAttribute("data-tab") === cur);
        });
        panels.forEach(function (p) { p.style.display = p.getAttribute("data-panel") === cur ? "block" : "none"; });
        document.getElementById("auth-title").textContent = cur === "register" ? T("Реєстрація") : T("Вхід");
        document.getElementById("auth-switch-hint").innerHTML =
          '<button type="button" class="auth-link" data-switch="' + (cur === "register" ? "login" : "register") + '">' +
          T(cur === "register" ? "Вже маєте акаунт? Увійдіть" : "Новий клієнт? Зареєструйтеся") + "</button>";
        hideMsg();
        if (cur === "register") document.getElementById("reg-code-box").style.display = "none";
        if (cur === "login") closeRecover();
      }

      tabs.forEach(function (t) {
        t.addEventListener("click", function () { showTab(t.getAttribute("data-tab")); });
      });
      document.getElementById("auth-switch-hint").addEventListener("click", function (e) {
        var b = e.target.closest("[data-switch]");
        if (b) showTab(b.getAttribute("data-switch"));
      });
      showTab(cur);

      var auth = qp("auth");
      if (auth === "registered") showMsg(T("Акаунт створено!"), true);
      else if (auth === "denied") showMsg(T("Доступ заборонено"), false);

      function post(url, data) {
        return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
          .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); });
      }
      function btnState(btn, busy) { btn.disabled = busy; btn.style.opacity = busy ? "0.5" : "1"; }

      /* LOGIN */
      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("login-email").value.trim();
        var pw = document.getElementById("login-password").value;
        if (!email || !pw) return;
        var btn = this.querySelector(".auth-submit");
        btnState(btn, true);
        post("/api/auth/login", { email: email, password: pw, cf_turnstile: turnstileToken.login })
          .then(function (res) {
            if (res.status === 200) { if (window.turnstile) turnstile.reset(); location.href = next || "/"; }
            else if (res.status === 401 && res.d.detail === "use google login") showMsg(T("Цей акаунт створено через Google. Увійдіть через Google"), false);
            else showMsg(T("Невірна пошта або пароль"), false);
          })
          .catch(function () { showMsg(T("Помилка з'єднання"), false); })
          .finally(function () { btnState(btn, false); });
      });

      /* RECOVERY */
      var recoverEmail = "";
      function openRecover() {
        hideMsg();
        document.getElementById("login-main").style.display = "none";
        document.getElementById("recover-box").style.display = "block";
        document.getElementById("recover-email-step").style.display = "block";
        document.getElementById("recover-code-step").style.display = "none";
        document.getElementById("recover-email").focus();
      }
      function closeRecover() {
        document.getElementById("recover-box").style.display = "none";
        document.getElementById("login-main").style.display = "block";
      }
      document.getElementById("forgot-btn").addEventListener("click", openRecover);
      document.getElementById("recover-back").addEventListener("click", closeRecover);

      document.getElementById("recover-send").addEventListener("click", function () {
        var email = document.getElementById("recover-email").value.trim();
        if (!email) return;
        var btn = this;
        btnState(btn, true);
        post("/api/auth/recover", { email: email, cf_turnstile: turnstileToken.recover })
          .then(function (res) {
            if (res.status === 200) {
              if (window.turnstile) turnstile.reset();
              recoverEmail = email;
              document.getElementById("recover-email-step").style.display = "none";
              document.getElementById("recover-code-step").style.display = "block";
              document.getElementById("recover-code").focus();
              showMsg(T("Код надіслано на %s", email), true);
            } else if (res.status === 404) showMsg(T("Цю пошту не знайдено"), false);
            else showMsg(T("Не вдалося відправити код. Спробуйте пізніше"), false);
          })
          .catch(function () { showMsg(T("Помилка з'єднання"), false); })
          .finally(function () { btnState(btn, false); });
      });

      document.getElementById("recover-resend").addEventListener("click", function () {
        var email = recoverEmail || document.getElementById("recover-email").value.trim();
        if (!email) return;
        var btn = this;
        btnState(btn, true);
        post("/api/auth/recover", { email: email, cf_turnstile: turnstileToken.recover })
          .then(function (res) {
            if (res.status === 200) showMsg(T("Код надіслано на %s", email), true);
            else if (res.status === 404) showMsg(T("Цю пошту не знайдено"), false);
            else showMsg(T("Не вдалося відправити код. Спробуйте пізніше"), false);
          })
          .catch(function () { showMsg(T("Помилка з'єднання"), false); })
          .finally(function () { btnState(btn, false); });
      });

      document.getElementById("recover-confirm").addEventListener("click", function () {
        var code = document.getElementById("recover-code").value.trim();
        var pw = document.getElementById("recover-password").value;
        var pw2 = document.getElementById("recover-password2").value;
        if (pw !== pw2) { showMsg(T("Паролі не збігаються"), false); return; }
        if (pw.length < 8) { showMsg(T("Пароль занадто короткий (мін. 8 символів)"), false); return; }
        var btn = this;
        btnState(btn, true);
        post("/api/auth/recover/confirm", { email: recoverEmail, code: code, password: pw, cf_turnstile: turnstileToken.recover })
          .then(function (res) {
            if (res.status === 200) {
              if (window.turnstile) turnstile.reset();
              showMsg(T("Пароль змінено! Увійдіть з новим паролем"), true);
              document.getElementById("recover-code-step").style.display = "none";
              document.getElementById("recover-email-step").style.display = "block";
              setTimeout(closeRecover, 2500);
            } else if (res.status === 400 && res.d.detail === "wrong code") showMsg(T("Невірний код. Спробуйте ще раз"), false);
            else if (res.status === 400 && res.d.detail === "code expired") showMsg(T("Код протерміновано. Надішліть новий"), false);
            else showMsg(T("Невірний код. Спробуйте ще раз"), false);
          })
          .catch(function () { showMsg(T("Помилка з'єднання"), false); })
          .finally(function () { btnState(btn, false); });
      });

      /* REGISTER */
      var regEmail = "";
      document.getElementById("reg-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("reg-email").value.trim();
        var pw = document.getElementById("reg-password").value;
        var pw2 = document.getElementById("reg-password2").value;
        if (pw !== pw2) { showMsg(T("Паролі не збігаються"), false); return; }
        var btn = this.querySelector(".auth-submit");
        btnState(btn, true);
        post("/api/auth/register", { email: email, password: pw, cf_turnstile: turnstileToken.register })
          .then(function (res) {
            if (res.status === 200) {
              if (window.turnstile) turnstile.reset();
              regEmail = email;
              document.getElementById("reg-form").style.display = "none";
              document.getElementById("reg-code-box").style.display = "block";
              document.getElementById("reg-code").focus();
              showMsg(T("Код надіслано на %s", email), true);
            } else if (res.status === 409) showMsg(T("Ця пошта вже зареєстрована"), false);
            else if (res.status === 400 && res.d.detail === "invalid email") showMsg(T("Невірна пошта"), false);
            else if (res.status === 400 && res.d.detail === "password too short") showMsg(T("Пароль занадто короткий (мін. 8 символів)"), false);
            else showMsg(T("Не вдалося відправити код. Спробуйте пізніше"), false);
          })
          .catch(function () { showMsg(T("Помилка з'єднання"), false); })
          .finally(function () { btnState(btn, false); });
      });

      document.getElementById("reg-confirm").addEventListener("click", function () {
        var code = document.getElementById("reg-code").value.trim();
        if (!code) return;
        var btn = this;
        btnState(btn, true);
        post("/api/auth/verify", { email: regEmail, code: code })
          .then(function (res) {
            if (res.status === 200) location.href = next || "/?auth=registered";
            else if (res.status === 400 && res.d.detail === "wrong code") showMsg(T("Невірний код. Спробуйте ще раз"), false);
            else if (res.status === 400 && res.d.detail === "code expired") showMsg(T("Код протерміновано. Надішліть новий"), false);
            else showMsg(T("Невірний код. Спробуйте ще раз"), false);
          })
          .catch(function () { showMsg(T("Помилка з'єднання"), false); })
          .finally(function () { btnState(btn, false); });
      });

      document.getElementById("reg-resend").addEventListener("click", function () {
        var email = regEmail || document.getElementById("reg-email").value.trim();
        if (!email) return;
        var btn = this;
        btnState(btn, true);
        post("/api/auth/register", { email: email, password: document.getElementById("reg-password").value, cf_turnstile: turnstileToken.register })
          .then(function (res) {
            if (res.status === 200) showMsg(T("Код надіслано на %s", email), true);
            else showMsg(T("Не вдалося відправити код. Спробуйте пізніше"), false);
          })
          .catch(function () { showMsg(T("Помилка з'єднання"), false); })
          .finally(function () { btnState(btn, false); });
      });

      function bindCodeAuto(elId, btnId) {
        var input = document.getElementById(elId);
        input.addEventListener("input", function () {
          this.value = this.value.replace(/[^\d]/g, "").slice(0, 6);
          if (this.value.length === 6) document.getElementById(btnId).click();
        });
      }
      bindCodeAuto("reg-code", "reg-confirm");
      bindCodeAuto("recover-code", "recover-confirm");
    })();
  </script>
</body>
</html>
